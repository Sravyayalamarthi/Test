
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First CI/CD Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 60px 20px;
            background: #f3f6fb;
            color: #243047;
        }

        .card {
            max-width: 600px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px #00000012;
        }

        h1 {
            color: #1769aa;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My First CI/CD Project!</h1>
        <p>I'm learning Continuous Integration and Deployment.</p>
        <p>This website is hosted using GitHub Pages.</p>

        <button onclick="showMessage()">Click Me</button>
        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "My CI/CD journey has started successfully!";
        }
    </script>
</body>
</html>
